<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典賽車避障 - 現代模組化版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas" width="440" height="640"></canvas>
    <div class="instructions">
        <span class="highlight">[A/D] 或 [←/→]</span> 方向盤轉向 | <span class="highlight">[W/S]</span> 油門 / 煞車<br>
        <span class="highlight">[Shift / 空白鍵]</span> 手煞車甩尾（轉彎時減速甩尾累積高分！）
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
